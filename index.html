<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID//FORGE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:system-ui;color:#fff;padding:10px}
.app{max-width:900px;margin:auto;background:#0a0a0a;border-radius:20px;padding:12px;border:1px solid #222}
.header{text-align:center;margin-bottom:10px}
.header h1{font-size:1.4rem}
.header p{font-size:.7rem;color:#777}

.card{background:#111;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #222}
.title{font-size:.85rem;margin-bottom:6px;border-left:3px solid #fff;padding-left:5px}

.upload{border:2px dashed #333;padding:18px;text-align:center;border-radius:10px;cursor:pointer}
.upload i{font-size:26px;color:#777}
.upload p{font-size:.7rem;color:#777;margin-top:4px}

textarea{width:100%;margin-top:8px;background:#050505;border:1px solid #222;border-radius:10px;padding:8px;color:#fff;font-size:.8rem}

button{width:100%;margin-top:8px;background:#fff;color:#000;border:none;padding:8px;border-radius:20px;font-weight:600;cursor:pointer}

.status{font-size:.7rem;text-align:center;margin-top:6px;color:#aaa}

.preview img,.result img{width:100%;border-radius:10px;margin-top:6px}

.actions{margin-top:6px;display:none}
.actions button{background:#111;border:1px solid #333;color:#fff}

.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px;margin-top:8px}
.history img{width:100%;border-radius:6px}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;justify-content:center;align-items:center}
.modal img{max-width:90%;max-height:90%}

.footer{text-align:center;font-size:.65rem;color:#555;margin-top:6px}
</style>
</head>
<body>

<div class="app">

<div class="header">
<h1>VOID//FORGE</h1>
<p>feed garbage • get something usable</p>
</div>

<div class="card">
<div class="title">input</div>

<div class="upload" id="upload">
<i class="fas fa-cloud-upload-alt"></i>
<p>drop image</p>
</div>

<input type="file" id="file" hidden>

<div class="preview" id="preview"></div>

<textarea id="prompt" placeholder="type prompt"></textarea>

<button id="go">generate</button>

<div class="status" id="status">idle</div>
</div>

<div class="card">
<div class="title">output</div>

<div class="result" id="result"></div>

<div class="actions" id="tools">
<button id="copy">copy image</button>
</div>

<div class="history" id="history"></div>
</div>

<div class="footer">Made with 🖕by NZ R</div>

</div>

<div class="modal" id="modal">
<img id="modalImg">
</div>

<script>
const upload=document.getElementById("upload")
const file=document.getElementById("file")
const preview=document.getElementById("preview")
const result=document.getElementById("result")
const status=document.getElementById("status")
const tools=document.getElementById("tools")
const historyBox=document.getElementById("history")

let uploaded=null
let output=null
const key="0be58d103f6f628f39a5ecda27e0f440"

upload.onclick=()=>file.click()

file.onchange=e=>{
let f=e.target.files[0]
if(!f){status.innerText="no file";return}

let r=new FileReader()
r.onload=x=>preview.innerHTML=`<img src="${x.target.result}">`
r.readAsDataURL(f)

uploadImg(f)
}

async function uploadImg(f){
status.innerText="uploading..."
let fd=new FormData()
fd.append("key",key)
fd.append("image",f)

let res=await fetch("https://api.imgbb.com/1/upload",{method:"POST",body:fd})
let data=await res.json()

if(data.success){
uploaded=data.data.url
status.innerText="uploaded"
}else{
status.innerText="failed"
}
}

document.getElementById("go").onclick=async()=>{
let p=document.getElementById("prompt").value.trim()

if(!uploaded){status.innerText="no image";return}
if(!p){status.innerText="no prompt";return}

status.innerText="processing..."
result.innerHTML=""
tools.style.display="none"

let url=`https://rifatapiv3.vercel.app/api/ai/nanopro?p=${encodeURIComponent(p)}&url=${encodeURIComponent(uploaded)}`
let res=await fetch(url)
let data=await res.json()

if(data.status){
output=data.result
result.innerHTML=`<img src="${output}" onclick="openModal('${output}')">`
tools.style.display="block"
status.innerText="done"
saveHistory(output)
}else{
status.innerText="failed"
}
}

async function copyImage(){
if(!output){status.innerText="nothing to copy";return}

try{
let blob=await fetch(output).then(r=>r.blob())
await navigator.clipboard.write([
new ClipboardItem({[blob.type]:blob})
])
status.innerText="copied"
}catch{
let img=document.createElement("img")
img.src=output
document.body.appendChild(img)
let range=document.createRange()
range.selectNode(img)
window.getSelection().removeAllRanges()
window.getSelection().addRange(range)
document.execCommand("copy")
document.body.removeChild(img)
status.innerText="copied (fallback)"
}
}

document.getElementById("copy").onclick=copyImage

function saveHistory(url){
let arr=JSON.parse(localStorage.getItem("hist")||"[]")
arr.unshift(url)
arr=arr.slice(0,10)
localStorage.setItem("hist",JSON.stringify(arr))
renderHistory()
}

function renderHistory(){
let arr=JSON.parse(localStorage.getItem("hist")||"[]")
historyBox.innerHTML=arr.map(u=>`<img src="${u}" onclick="openModal('${u}')">`).join("")
}

function openModal(src){
document.getElementById("modal").style.display="flex"
document.getElementById("modalImg").src=src
}

document.getElementById("modal").onclick=()=>document.getElementById("modal").style.display="none"

renderHistory()
</script>

</body>
</html>
