<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MONOCHROME | AI IMAGE FORGE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #fff;
            line-height: 1.5;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes borderGlow {
            0% { border-color: #2a2a2a; }
            50% { border-color: #555; }
            100% { border-color: #2a2a2a; }
        }

        .app-container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            animation: fadeIn 0.5s ease-out;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2c2c2c;
            padding-bottom: 1rem;
        }
        .brand h1 {
            font-size: 2rem;
            letter-spacing: -0.02em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .brand h1 i {
            font-size: 1.8rem;
            color: #e0e0e0;
            transition: transform 0.3s ease;
        }
        .brand h1 i:hover {
            transform: rotate(15deg);
        }
        .brand p {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        .workflow {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1rem;
        }
        .upload-panel {
            flex: 1.2;
            min-width: 240px;
        }
        .preview-panel {
            flex: 1;
            min-width: 260px;
        }

        .card {
            background: #111111;
            border: 1px solid #2b2b2b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #3a3a3a;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 3px solid #ffffff;
            padding-left: 0.75rem;
        }
        .card-title i {
            font-size: 1.2rem;
            color: #ddd;
        }

        .upload-area {
            border: 2px dashed #3a3a3a;
            background: #0c0c0c;
            border-radius: 1.2rem;
            padding: 1.8rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.2rem;
        }
        .upload-area:hover {
            border-color: #ffffff;
            background: #151515;
            transform: scale(1.02);
        }
        .upload-area i {
            font-size: 2.8rem;
            color: #ccc;
            margin-bottom: 0.8rem;
            transition: transform 0.3s ease;
        }
        .upload-area:hover i {
            transform: translateY(-5px);
        }
        .upload-area p {
            font-size: 0.9rem;
            color: #bbb;
        }
        .file-input {
            display: none;
        }
        .image-preview {
            margin-top: 1rem;
            background: #080808;
            border-radius: 1rem;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 0.75rem;
            border: 1px solid #2a2a2a;
            object-fit: contain;
            background: #000;
            transition: transform 0.3s ease;
        }
        .image-preview img:hover {
            transform: scale(1.02);
        }
        .img-placeholder {
            color: #666;
            font-size: 0.8rem;
            padding: 1rem;
        }

        .prompt-group {
            margin: 1rem 0 0.8rem;
        }
        .prompt-group label {
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }
        .prompt-input {
            width: 100%;
            background: #050505;
            border: 1px solid #2e2e2e;
            border-radius: 1rem;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s ease;
            resize: vertical;
        }
        .prompt-input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 2px #3a3a3a;
            transform: translateY(-1px);
        }
        .btn-generate {
            width: 100%;
            background: #ffffff;
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.2rem;
        }
        .btn-generate:hover {
            background: #e6e6e6;
            transform: scale(0.98);
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }
        .btn-generate:active {
            transform: scale(0.96);
        }
        .btn-generate i {
            font-size: 1rem;
            color: #000;
        }

        .result-card {
            background: #0b0b0b;
            border-radius: 1.5rem;
            text-align: center;
            padding: 1rem;
            border: 1px solid #2c2c2c;
        }
        .result-image-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            cursor: pointer;
        }
        .result-image {
            width: 100%;
            border-radius: 1rem;
            max-height: 320px;
            object-fit: contain;
            background: #000000;
            border: 1px solid #2b2b2b;
            transition: all 0.3s ease;
        }
        .result-image:hover {
            transform: scale(1.02);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .preview-badge {
            margin-top: 0.6rem;
            font-size: 0.75rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            color: #aaa;
        }
        .preview-badge span {
            background: #1c1c1c;
            padding: 0.25rem 0.8rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s ease;
        }
        .preview-badge span:hover {
            background: #2a2a2a;
            transform: translateX(3px);
        }
        .download-area {
            margin-top: 1rem;
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .btn-download, .btn-preview-trigger {
            background: transparent;
            border: 1px solid #3f3f3f;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-download:hover, .btn-preview-trigger:hover {
            background: #1f1f1f;
            border-color: #ffffff;
            color: white;
            transform: translateY(-2px);
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .spinner-white {
            border-top: 2px solid #fff;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-msg {
            background: #121212;
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            text-align: center;
            font-size: 0.8rem;
            margin-top: 1rem;
            color: #aaa;
            border-left: 2px solid #333;
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
        }
        .modal-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        .modal-preview.active {
            display: flex;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
        }
        .modal-content img {
            width: auto;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 1rem;
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .close-modal:hover {
            transform: scale(1.2);
            color: #ff0000;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            padding: 1rem;
            border-top: 1px solid #1f1f1f;
            font-size: 0.8rem;
            color: #666;
            transition: all 0.3s ease;
        }
        .footer:hover {
            color: #888;
        }
        .footer i {
            color: #ff4444;
            animation: pulse 1.5s infinite;
        }

        @media (max-width: 720px) {
            body {
                padding: 0.8rem;
            }
            .app-container {
                padding: 1rem;
            }
            .brand h1 {
                font-size: 1.5rem;
            }
            .card-title {
                font-size: 1rem;
            }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand">
        <h1>
            <i class="fas fa-drafting-compass"></i> 
            MONOCHROME · AI FORGE
        </h1>
        <p>upload · prompt · transform · black & white essence</p>
    </div>

    <div class="workflow">
        <div class="upload-panel">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>source image</span>
                </div>
                <div class="upload-area" id="uploadTrigger">
                    <i class="fas fa-image"></i>
                    <p>click or drag & drop</p>
                    <p style="font-size: 0.7rem; margin-top: 0.3rem;">PNG, JPG, WEBP up to 5MB</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp,image/jpg">
                <div class="image-preview" id="imagePreviewContainer">
                    <div class="img-placeholder">
                        <i class="fas fa-camera"></i> no image selected
                    </div>
                </div>

                <div class="prompt-group">
                    <label><i class="fas fa-pen-fancy"></i> edit prompt</label>
                    <textarea class="prompt-input" id="promptText" rows="2" placeholder="Describe edit: e.g., 'make it black and white', 'add vintage grain', 'high contrast monochrome' ..."></textarea>
                </div>
                <button class="btn-generate" id="generateBtn">
                    <i class="fas fa-magic"></i> generate AI edit
                </button>
                <div class="status-msg" id="statusMsg">
                    <i class="fas fa-info-circle"></i> ready
                </div>
            </div>
        </div>

        <div class="preview-panel">
            <div class="card result-card">
                <div class="card-title">
                    <i class="fas fa-robot"></i>
                    <span>AI output</span>
                </div>
                <div id="resultArea">
                    <div class="img-placeholder" style="padding: 2rem;">
                        <i class="fas fa-hourglass-half"></i> result will appear here
                    </div>
                </div>
                <div class="download-area" id="downloadTools" style="display: none;">
                    <button class="btn-preview-trigger" id="previewModalBtn">
                        <i class="fas fa-expand"></i> tap to preview
                    </button>
                    <button class="btn-download" id="downloadBtn">
                        <i class="fas fa-download"></i> download image
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        Made with <i class="fas fa-fist-raised"></i>🖕 by NZ R
    </div>
</div>

<div id="imageModal" class="modal-preview">
    <button class="close-modal" id="closeModalBtn">&times;</button>
    <div class="modal-content">
        <img id="modalImg" alt="full preview" src="">
    </div>
</div>

<script>
    (function(){
        const uploadTrigger = document.getElementById('uploadTrigger');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const promptTextarea = document.getElementById('promptText');
        const generateBtn = document.getElementById('generateBtn');
        const statusMsgDiv = document.getElementById('statusMsg');
        const resultArea = document.getElementById('resultArea');
        const downloadTools = document.getElementById('downloadTools');
        const previewModalBtn = document.getElementById('previewModalBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let currentUploadedImageUrl = null;
        let currentGeneratedResultUrl = null;
        let isProcessing = false;

        const IMGBB_API_KEY = "0be58d103f6f628f39a5ecda27e0f440";
        const IMGBB_UPLOAD_URL = "https://api.imgbb.com/1/upload";
        const AI_EDIT_API_BASE = "https://rifatapiv3.vercel.app/api/ai/nanopro";

        const savageMessages = {
            noImage: "ARE YOU BLIND? UPLOAD SOMETHING FIRST YOU ABSOLUTE DONUT 🍩",
            uploadError: "CONGRATULATIONS! YOU BROKE IT. EVEN THE AI IS JUDGING YOU RIGHT NOW 🤡",
            aiFailed: "YOUR IMAGE WAS SO TRASH THE AI REFUSED TO TOUCH IT. TRY AGAIN, IF YOU DARE 💀",
            processing: "FINALLY YOU DID SOMETHING... TOO BAD YOU'RE STILL USELESS 🙄",
            emptyPrompt: "OH LOOK, ANOTHER LAZY HUMAN. FINE, I'LL DO THE WORK FOR YOU (AGAIN) 😒",
            success: "MIRACLE HAPPENED! EVEN A BLIND SQUIRREL COULD DO BETTER, BUT OKAY 🎉",
            downloadReady: "HERE'S YOUR IMAGE. DON'T FRAME IT, YOU DON'T HAVE TASTE ANYWAY 😏",
            largeFile: "5MB MAX YOU GREEDY PHOTO HOARDER! COMPRESS THAT MONSTROSITY 📦",
            dragError: "SERIOUSLY? THAT'S NOT AN IMAGE. ARE YOU NEW TO EARTH? 👽"
        };

        function setSavageStatus(message, isError = false) {
            const rudePrefix = isError ? "💢 " : "⚡ ";
            statusMsgDiv.innerHTML = `<i class="fas ${isError ? 'fa-skull' : 'fa-bolt'}"></i> ${rudePrefix}${message}`;
            if(isError) {
                statusMsgDiv.style.color = "#ff6b6b";
                statusMsgDiv.style.borderLeftColor = "#ff0000";
                setTimeout(() => {
                    if(statusMsgDiv.innerHTML.includes(message)) {
                        statusMsgDiv.style.color = "#aaa";
                        statusMsgDiv.style.borderLeftColor = "#333";
                    }
                }, 4000);
            } else {
                statusMsgDiv.style.color = "#eee";
                setTimeout(() => {
                    statusMsgDiv.style.color = "#aaa";
                }, 3000);
            }
        }

        function showUploadPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewContainer.innerHTML = `
                    <img src="${e.target.result}" alt="upload preview" style="max-width:100%; max-height:200px; border-radius:0.75rem; border:1px solid #333;">
                `;
            };
            reader.readAsDataURL(file);
        }

        async function uploadToImgbb(file) {
            const formData = new FormData();
            formData.append("key", IMGBB_API_KEY);
            formData.append("image", file);
            try {
                setSavageStatus("UPLOADING... HOPE IT'S NOT A SELFIE 🤮");
                const response = await fetch(IMGBB_UPLOAD_URL, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if(data && data.success && data.data && data.data.url) {
                    const directUrl = data.data.url;
                    setSavageStatus("IMAGE HOSTED. DON'T SCREW UP THE NEXT STEP 😤");
                    return directUrl;
                } else {
                    throw new Error(data.error?.message || "upload failed");
                }
            } catch(err) {
                console.error(err);
                throw new Error(savageMessages.uploadError);
            }
        }

        async function callImageEditAPI(imageUrl, userPrompt) {
            let finalPrompt = userPrompt && userPrompt.trim() !== "" ? userPrompt.trim() : "make it black and white, high contrast monochrome style";
            const encodedPrompt = encodeURIComponent(finalPrompt);
            const encodedImageUrl = encodeURIComponent(imageUrl);
            const apiUrl = `${AI_EDIT_API_BASE}?p=${encodedPrompt}&url=${encodedImageUrl}`;
            try {
                setSavageStatus(savageMessages.processing);
                const response = await fetch(apiUrl);
                const result = await response.json();
                if(result && result.status === true && result.result && typeof result.result === "string") {
                    return result.result;
                } else {
                    let errMsg = result.error || "api returned unexpected response";
                    throw new Error(errMsg);
                }
            } catch(err) {
                console.error(err);
                throw new Error(savageMessages.aiFailed);
            }
        }

        function showLoadingOnResult() {
            resultArea.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; gap:0.8rem; background:#0f0f0f; padding:2rem; border-radius:1.2rem;">
                    <div class="spinner spinner-white" style="border-top-color:#aaa;"></div>
                    <span style="color:#ccc;">SMOKING THE IMAGE... WAIT 🚬</span>
                </div>
            `;
            downloadTools.style.display = "none";
            currentGeneratedResultUrl = null;
        }

        function displayResultImage(imageUrl) {
            currentGeneratedResultUrl = imageUrl;
            resultArea.innerHTML = `
                <div class="result-image-wrapper" id="resultImgWrapper">
                    <img src="${imageUrl}" alt="edited result" class="result-image" id="resultImg">
                </div>
                <div class="preview-badge">
                    <span><i class="fas fa-vector-square"></i> AI REFINED · MONOCHROME</span>
                </div>
            `;
            downloadTools.style.display = "flex";
            const resultImgElem = document.getElementById('resultImg');
            if(resultImgElem) {
                resultImgElem.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModalWithImage(imageUrl);
                });
            }
            setSavageStatus(savageMessages.success);
        }

        function openModalWithImage(src) {
            if(!src) return;
            modalImg.src = src;
            modal.classList.add('active');
        }
        function closeModal() {
            modal.classList.remove('active');
        }

        function downloadCurrentImage() {
            if(!currentGeneratedResultUrl) {
                setSavageStatus("NOTHING TO DOWNLOAD, YOU ABSOLUTE NOOB", true);
                return;
            }
            const link = document.createElement('a');
            link.href = currentGeneratedResultUrl;
            link.download = `ai_edit_${Date.now()}.png`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setSavageStatus(savageMessages.downloadReady);
        }

        async function onGenerate() {
            if(isProcessing) {
                setSavageStatus("I'M ALREADY WORKING, HAVE SOME PATIENCE YOU IMPATIENT GREMLIN", true);
                return;
            }
            if(!currentUploadedImageUrl) {
                setSavageStatus(savageMessages.noImage, true);
                return;
            }
            const prompt = promptTextarea.value;
            if(!prompt || prompt.trim() === "") {
                setSavageStatus(savageMessages.emptyPrompt, false);
            }
            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.innerHTML = `<div class="spinner" style="border-top-color:#000;"></div> ROASTING YOUR IMAGE...`;
            showLoadingOnResult();

            try {
                const resultImageUrl = await callImageEditAPI(currentUploadedImageUrl, prompt);
                if(resultImageUrl && resultImageUrl.startsWith("http")) {
                    displayResultImage(resultImageUrl);
                } else {
                    throw new Error("invalid result");
                }
            } catch(error) {
                console.error(error);
                setSavageStatus(savageMessages.aiFailed, true);
                resultArea.innerHTML = `<div class="img-placeholder" style="color:#ff6b6b;"><i class="fas fa-dumpster-fire"></i> AI TOOK ONE LOOK AND RAN AWAY. TRY SOMETHING LESS PATHETIC</div>`;
                downloadTools.style.display = "none";
                currentGeneratedResultUrl = null;
            } finally {
                isProcessing = false;
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<i class="fas fa-magic"></i> generate AI edit`;
            }
        }

        async function handleFileSelection(file) {
            if(!file) return;
            if(file.size > 5 * 1024 * 1024) {
                setSavageStatus(savageMessages.largeFile, true);
                return;
            }
            showUploadPreview(file);
            setSavageStatus("UPLOADING YOUR MEDIOCRE IMAGE...");
            try {
                const directUrl = await uploadToImgbb(file);
                currentUploadedImageUrl = directUrl;
                setSavageStatus(`IMAGE LOADED. DON'T MESS THIS UP, ROOKIE`);
                const existingPreview = previewContainer.querySelector('img');
                if(existingPreview) {
                    let badgeSpan = document.createElement('div');
                    badgeSpan.style.fontSize = "0.7rem";
                    badgeSpan.style.marginTop = "0.5rem";
                    badgeSpan.style.color = "#aaa";
                    badgeSpan.innerHTML = '<i class="fas fa-check-circle"></i> HOSTED ✓';
                    if(!previewContainer.querySelector('.hosted-badge')) {
                        badgeSpan.className = "hosted-badge";
                        previewContainer.appendChild(badgeSpan);
                    }
                }
            } catch(err) {
                setSavageStatus(savageMessages.uploadError, true);
                currentUploadedImageUrl = null;
                previewContainer.innerHTML = `<div class="img-placeholder"><i class="fas fa-exclamation-triangle"></i> UPLOAD FAILED, TRY A REAL IMAGE NEXT TIME</div>`;
            }
        }

        fileInput.addEventListener('change', (e) => {
            if(e.target.files && e.target.files.length) {
                handleFileSelection(e.target.files[0]);
            }
        });

        uploadTrigger.addEventListener('click', () => {
            fileInput.click();
        });

        const dropZone = uploadTrigger;
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#ffffff";
            dropZone.style.backgroundColor = "#181818";
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#3a3a3a";
            dropZone.style.backgroundColor = "#0c0c0c";
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#3a3a3a";
            dropZone.style.backgroundColor = "#0c0c0c";
            const files = e.dataTransfer.files;
            if(files.length) {
                const file = files[0];
                if(file.type.startsWith('image/')) {
                    handleFileSelection(file);
                } else {
                    setSavageStatus(savageMessages.dragError, true);
                }
            }
        });

        generateBtn.addEventListener('click', onGenerate);
        previewModalBtn.addEventListener('click', () => {
            if(currentGeneratedResultUrl) {
                openModalWithImage(currentGeneratedResultUrl);
            } else {
                setSavageStatus("NOTHING TO PREVIEW, LOSER. GENERATE SOMETHING FIRST", true);
            }
        });
        downloadBtn.addEventListener('click', downloadCurrentImage);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        promptTextarea.value = "make it black and white, deep shadows, artistic monochrome";
        setSavageStatus("READY TO WORK. DON'T WASTE MY TIME WITH UGLY IMAGES");
    })();
</script>
</body>
</html>
