<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Editor | Mono</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --border: #333333;
            --text: #ffffff;
            --accent: #ffffff;
            --muted: #888888;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: #1a1a1a;
        }
        .upload-area i {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .upload-area p {
            font-size: 0.9rem;
            color: var(--muted);
        }
        #preview-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--surface);
        }
        #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: 6px;
            outline: none;
            transition: border 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.3s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-area {
            margin-top: 30px;
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .result-card {
            background: var(--bg);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .result-card img {
            width: 100%;
            display: block;
            cursor: zoom-in;
        }
        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            font-size: 0.85rem;
        }
        .action-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--bg);
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #file-input { display: none; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .modal img { max-width: 90%; max-height: 90%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> Image Studio</h1>
    </div>

    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <div id="upload-prompt">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Click to upload image</p>
        </div>
        <div id="preview-container">
            <img id="preview-img" src="" alt="preview">
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <div class="input-group">
        <input type="text" id="prompt-input" placeholder="Enter your prompt (e.g. make it black and white)">
    </div>

    <button id="generate-btn">
        <span id="btn-text">GENERATE</span>
        <div class="loader" id="loader"></div>
    </button>

    <div class="result-area" id="result-area">
        <div class="result-card">
            <img id="output-img" src="" alt="Result" onclick="openModal(this.src)">
        </div>
        <div class="action-bar">
            <button class="action-btn" onclick="openModal(document.getElementById('output-img').src)">
                <i class="fa-solid fa-eye"></i> PREVIEW
            </button>
            <button class="action-btn" id="download-btn">
                <i class="fa-solid fa-download"></i> DOWNLOAD
            </button>
        </div>
    </div>
</div>

<div class="modal" id="modal" onclick="this.style.display='none'">
    <img id="modal-img" src="">
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('preview-img');
    const previewCont = document.getElementById('preview-container');
    const generateBtn = document.getElementById('generate-btn');
    const promptInput = document.getElementById('prompt-input');
    const resultArea = document.getElementById('result-area');
    const outputImg = document.getElementById('output-img');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btn-text');

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                previewImg.src = event.target.result;
                previewCont.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    async function uploadToHost(file) {
        const formData = new FormData();
        formData.append('key', 'bd207e02158e347ae35d0e2a901485c5');
        formData.append('action', 'upload');
        formData.append('source', file.split(',')[1]);
        formData.append('format', 'json');

        const response = await fetch('https://freeimage.host/api/1/upload', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        return data.image.url;
    }

    generateBtn.addEventListener('click', async () => {
        const prompt = promptInput.value;
        const file = fileInput.files[0];

        if (!file || !prompt) {
            alert('Please select an image and enter a prompt');
            return;
        }

        try {
            generateBtn.disabled = true;
            btnText.innerText = 'PROCESSING...';
            loader.style.display = 'block';

            const uploadedUrl = await uploadToHost(previewImg.src);
            
            const editApi = `https://rifatapiv3.vercel.app/api/ai/nanopro?p=${encodeURIComponent(prompt)}&url=${encodeURIComponent(uploadedUrl)}`;
            const response = await fetch(editApi);
            const data = await response.json();

            if (data.status && data.result) {
                outputImg.src = data.result;
                resultArea.style.display = 'block';
                resultArea.scrollIntoView({ behavior: 'smooth' });
            }
        } catch (error) {
            console.error(error);
            alert('An error occurred during generation.');
        } finally {
            generateBtn.disabled = false;
            btnText.innerText = 'GENERATE';
            loader.style.display = 'none';
        }
    });

    function openModal(src) {
        if (!src) return;
        document.getElementById('modal-img').src = src;
        document.getElementById('modal').style.display = 'flex';
    }

    document.getElementById('download-btn').addEventListener('click', async () => {
        const image = await fetch(outputImg.src);
        const imageBlog = await image.blob();
        const imageURL = URL.createObjectURL(imageBlog);
        const link = document.createElement('a');
        link.href = imageURL;
        link.download = 'generated-mono.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
