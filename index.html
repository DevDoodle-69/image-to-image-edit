<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MONOCHROME | AI Image Forge</title>
    <!-- Font Awesome 6 (Free Icons, black/white style) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #fff;
            line-height: 1.5;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* monochrome container */
        .app-container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        /* headers */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2c2c2c;
            padding-bottom: 1rem;
        }
        .brand h1 {
            font-size: 2rem;
            letter-spacing: -0.02em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .brand h1 i {
            font-size: 1.8rem;
            color: #e0e0e0;
        }
        .brand p {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* two column responsive layout */
        .workflow {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 1rem;
        }
        .upload-panel {
            flex: 1.2;
            min-width: 240px;
        }
        .preview-panel {
            flex: 1;
            min-width: 260px;
        }

        /* cards & UI */
        .card {
            background: #111111;
            border: 1px solid #2b2b2b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
            transition: 0.1s linear;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 3px solid #ffffff;
            padding-left: 0.75rem;
        }
        .card-title i {
            font-size: 1.2rem;
            color: #ddd;
        }

        /* upload zone */
        .upload-area {
            border: 2px dashed #3a3a3a;
            background: #0c0c0c;
            border-radius: 1.2rem;
            padding: 1.8rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.2rem;
        }
        .upload-area:hover {
            border-color: #ffffff;
            background: #151515;
        }
        .upload-area i {
            font-size: 2.8rem;
            color: #ccc;
            margin-bottom: 0.8rem;
        }
        .upload-area p {
            font-size: 0.9rem;
            color: #bbb;
        }
        .file-input {
            display: none;
        }
        .image-preview {
            margin-top: 1rem;
            background: #080808;
            border-radius: 1rem;
            padding: 0.5rem;
            text-align: center;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 0.75rem;
            border: 1px solid #2a2a2a;
            object-fit: contain;
            background: #000;
        }
        .img-placeholder {
            color: #666;
            font-size: 0.8rem;
            padding: 1rem;
        }

        /* prompt input */
        .prompt-group {
            margin: 1rem 0 0.8rem;
        }
        .prompt-group label {
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }
        .prompt-input {
            width: 100%;
            background: #050505;
            border: 1px solid #2e2e2e;
            border-radius: 1rem;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            color: #fff;
            font-family: inherit;
            transition: 0.2s;
            resize: vertical;
        }
        .prompt-input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 1px #3a3a3a;
        }
        .btn-generate {
            width: 100%;
            background: #ffffff;
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 1rem;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.2rem;
        }
        .btn-generate:hover {
            background: #e6e6e6;
            transform: scale(0.98);
        }
        .btn-generate:active {
            transform: scale(0.96);
        }
        .btn-generate i {
            font-size: 1rem;
            color: #000;
        }

        /* result area */
        .result-card {
            background: #0b0b0b;
            border-radius: 1.5rem;
            text-align: center;
            padding: 1rem;
            border: 1px solid #2c2c2c;
        }
        .result-image-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            cursor: pointer;
        }
        .result-image {
            width: 100%;
            border-radius: 1rem;
            max-height: 320px;
            object-fit: contain;
            background: #000000;
            border: 1px solid #2b2b2b;
            transition: 0.1s;
        }
        .preview-badge {
            margin-top: 0.6rem;
            font-size: 0.75rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            color: #aaa;
        }
        .preview-badge span {
            background: #1c1c1c;
            padding: 0.25rem 0.8rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .download-area {
            margin-top: 1rem;
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .btn-download, .btn-preview-trigger {
            background: transparent;
            border: 1px solid #3f3f3f;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: #f0f0f0;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-download:hover, .btn-preview-trigger:hover {
            background: #1f1f1f;
            border-color: #ffffff;
            color: white;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .spinner-white {
            border-top: 2px solid #fff;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            background: #ffffff;
            color: black;
        }
        .status-msg {
            background: #121212;
            border-radius: 2rem;
            padding: 0.6rem 1rem;
            text-align: center;
            font-size: 0.8rem;
            margin-top: 1rem;
            color: #aaa;
            border-left: 2px solid #333;
        }
        .modal-preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .modal-preview.active {
            display: flex;
        }
        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
        }
        .modal-content img {
            width: auto;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 1rem;
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            body {
                padding: 0.8rem;
            }
            .app-container {
                padding: 1rem;
            }
            .brand h1 {
                font-size: 1.5rem;
            }
            .card-title {
                font-size: 1rem;
            }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        hr {
            border-color: #252525;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand">
        <h1>
            <i class="fas fa-drafting-compass"></i> 
            MONOCHROME · AI FORGE
        </h1>
        <p>upload · prompt · transform · black & white essence</p>
    </div>

    <div class="workflow">
        <!-- left: upload & prompt -->
        <div class="upload-panel">
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>source image</span>
                </div>
                <div class="upload-area" id="uploadTrigger">
                    <i class="fas fa-image"></i>
                    <p>click or drag & drop</p>
                    <p style="font-size: 0.7rem; margin-top: 0.3rem;">PNG, JPG, WEBP up to 5MB</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/webp,image/jpg">
                <div class="image-preview" id="imagePreviewContainer">
                    <div class="img-placeholder">
                        <i class="fas fa-camera"></i> no image selected
                    </div>
                </div>

                <div class="prompt-group">
                    <label><i class="fas fa-pen-fancy"></i> edit prompt</label>
                    <textarea class="prompt-input" id="promptText" rows="2" placeholder="Describe edit: e.g., 'make it black and white', 'add vintage grain', 'high contrast monochrome' ..."></textarea>
                </div>
                <button class="btn-generate" id="generateBtn">
                    <i class="fas fa-magic"></i> generate AI edit
                </button>
                <div class="status-msg" id="statusMsg">
                    <i class="fas fa-info-circle"></i> ready
                </div>
            </div>
        </div>

        <!-- right: result & preview/download -->
        <div class="preview-panel">
            <div class="card result-card">
                <div class="card-title">
                    <i class="fas fa-robot"></i>
                    <span>AI output</span>
                </div>
                <div id="resultArea">
                    <div class="img-placeholder" style="padding: 2rem;">
                        <i class="fas fa-hourglass-half"></i> result will appear here
                    </div>
                </div>
                <div class="download-area" id="downloadTools" style="display: none;">
                    <button class="btn-preview-trigger" id="previewModalBtn">
                        <i class="fas fa-expand"></i> tap to preview
                    </button>
                    <button class="btn-download" id="downloadBtn">
                        <i class="fas fa-download"></i> download image
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- modal for full preview -->
<div id="imageModal" class="modal-preview">
    <button class="close-modal" id="closeModalBtn">&times;</button>
    <div class="modal-content">
        <img id="modalImg" alt="full preview" src="">
    </div>
</div>

<script>
    (function(){
        // DOM elements
        const uploadTrigger = document.getElementById('uploadTrigger');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const promptTextarea = document.getElementById('promptText');
        const generateBtn = document.getElementById('generateBtn');
        const statusMsgDiv = document.getElementById('statusMsg');
        const resultArea = document.getElementById('resultArea');
        const downloadTools = document.getElementById('downloadTools');
        const previewModalBtn = document.getElementById('previewModalBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // state
        let currentUploadedImageUrl = null;    // direct URL from imgbb
        let currentGeneratedResultUrl = null;   // final API result url
        let isProcessing = false;

        // imgbb API key
        const IMGBB_API_KEY = "0be58d103f6f628f39a5ecda27e0f440";
        const IMGBB_UPLOAD_URL = "https://api.imgbb.com/1/upload";

        // main edit endpoint (from given spec)
        const AI_EDIT_API_BASE = "https://rifatapiv3.vercel.app/api/ai/nanopro";

        // helper: update status
        function setStatus(message, isError = false) {
            statusMsgDiv.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-circle-info'}"></i> ${message}`;
            if(isError) {
                statusMsgDiv.style.color = "#ff9e8f";
                setTimeout(() => {
                    if(statusMsgDiv.innerHTML.includes(message)) {
                        statusMsgDiv.style.color = "#aaa";
                    }
                }, 3000);
            } else {
                statusMsgDiv.style.color = "#aaa";
            }
        }

        // display uploaded preview
        function showUploadPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewContainer.innerHTML = `
                    <img src="${e.target.result}" alt="upload preview" style="max-width:100%; max-height:200px; border-radius:0.75rem; border:1px solid #333;">
                `;
            };
            reader.readAsDataURL(file);
        }

        // upload image to imgbb and return direct url
        async function uploadToImgbb(file) {
            const formData = new FormData();
            formData.append("key", IMGBB_API_KEY);
            formData.append("image", file);
            // optional expiry: let it be default
            try {
                setStatus("uploading to image host...");
                const response = await fetch(IMGBB_UPLOAD_URL, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if(data && data.success && data.data && data.data.url) {
                    const directUrl = data.data.url;
                    setStatus("image uploaded ✓ ready for AI");
                    return directUrl;
                } else {
                    throw new Error(data.error?.message || "upload failed");
                }
            } catch(err) {
                console.error(err);
                throw new Error("imgbb upload error: " + err.message);
            }
        }

        // call the nano-pro image edit API (black/white style with prompt)
        async function callImageEditAPI(imageUrl, userPrompt) {
            // construct prompt: the user prompt + default blackwhite concept? 
            // but API seems to need final encoded prompt param: p=encoded_text
            // We'll combine the user prompt. According to specification, we need to provide prompt like "make it blackandwhite & ..."
            // example given: p=make%20it%20blackandwhite%20&url=...
            // we will construct: promptText + additional style if needed but respect user input.
            // to be robust: if prompt empty we add fallback "make it black and white"
            let finalPrompt = userPrompt && userPrompt.trim() !== "" ? userPrompt.trim() : "make it black and white, high contrast monochrome style";
            // encode for URL
            const encodedPrompt = encodeURIComponent(finalPrompt);
            // url encode image url
            const encodedImageUrl = encodeURIComponent(imageUrl);
            const apiUrl = `${AI_EDIT_API_BASE}?p=${encodedPrompt}&url=${encodedImageUrl}`;
            try {
                setStatus("calling AI engine...");
                const response = await fetch(apiUrl);
                const result = await response.json();
                if(result && result.status === true && result.result && typeof result.result === "string") {
                    return result.result; // direct generated image url
                } else {
                    let errMsg = result.error || "api returned unexpected response";
                    throw new Error(errMsg);
                }
            } catch(err) {
                console.error(err);
                throw new Error("AI edit failed: " + err.message);
            }
        }

        // reset result area and show loading indicator
        function showLoadingOnResult() {
            resultArea.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; gap:0.8rem; background:#0f0f0f; padding:2rem; border-radius:1.2rem;">
                    <div class="spinner spinner-white" style="border-top-color:#aaa;"></div>
                    <span style="color:#ccc;">generating AI edit ...</span>
                </div>
            `;
            downloadTools.style.display = "none";
            currentGeneratedResultUrl = null;
        }

        // display result image and enable download/preview
        function displayResultImage(imageUrl) {
            currentGeneratedResultUrl = imageUrl;
            resultArea.innerHTML = `
                <div class="result-image-wrapper" id="resultImgWrapper">
                    <img src="${imageUrl}" alt="edited result" class="result-image" id="resultImg">
                </div>
                <div class="preview-badge">
                    <span><i class="fas fa-vector-square"></i> AI refined · monochrome</span>
                </div>
            `;
            downloadTools.style.display = "flex";
            // attach click preview on result image directly (tap to preview feature)
            const resultImgElem = document.getElementById('resultImg');
            if(resultImgElem) {
                resultImgElem.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModalWithImage(imageUrl);
                });
            }
            // also the wrapper click, but fine
            setStatus("generation complete ✓ tap image or preview button");
        }

        // full preview modal functions
        function openModalWithImage(src) {
            if(!src) return;
            modalImg.src = src;
            modal.classList.add('active');
        }
        function closeModal() {
            modal.classList.remove('active');
        }

        // download action
        function downloadCurrentImage() {
            if(!currentGeneratedResultUrl) {
                setStatus("no generated image to download", true);
                return;
            }
            const link = document.createElement('a');
            link.href = currentGeneratedResultUrl;
            link.download = `ai_edit_${Date.now()}.png`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setStatus("download started");
        }

        // main generation pipeline
        async function onGenerate() {
            if(isProcessing) {
                setStatus("already processing, wait...", true);
                return;
            }
            // check if we have uploaded image
            if(!currentUploadedImageUrl) {
                setStatus("please select/upload an image first", true);
                return;
            }
            const prompt = promptTextarea.value;
            if(!prompt || prompt.trim() === "") {
                // optional: but we can still proceed with default prompt but display warning
                setStatus("prompt empty — using default 'make it black and white'", false);
                // but we continue anyway
            }
            isProcessing = true;
            generateBtn.disabled = true;
            generateBtn.innerHTML = `<div class="spinner" style="border-top-color:#000;"></div> processing...`;
            showLoadingOnResult();

            try {
                // call AI edit with current uploaded image URL + prompt
                const resultImageUrl = await callImageEditAPI(currentUploadedImageUrl, prompt);
                if(resultImageUrl && resultImageUrl.startsWith("http")) {
                    displayResultImage(resultImageUrl);
                    setStatus("success! AI transformed your image.");
                } else {
                    throw new Error("invalid result url from API");
                }
            } catch(error) {
                console.error(error);
                setStatus(`error: ${error.message}`, true);
                resultArea.innerHTML = `<div class="img-placeholder" style="color:#ff9180;"><i class="fas fa-skull-crosswalk"></i> generation failed. check console or try again</div>`;
                downloadTools.style.display = "none";
                currentGeneratedResultUrl = null;
            } finally {
                isProcessing = false;
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<i class="fas fa-magic"></i> generate AI edit`;
            }
        }

        // Trigger file upload & upload to imgbb
        async function handleFileSelection(file) {
            if(!file) return;
            // check file size below 5mb roughly
            if(file.size > 5 * 1024 * 1024) {
                setStatus("file too large (max 5MB)", true);
                return;
            }
            // show local preview
            showUploadPreview(file);
            setStatus("uploading to image host...");
            try {
                const directUrl = await uploadToImgbb(file);
                currentUploadedImageUrl = directUrl;
                setStatus(`image ready! url: ${directUrl.substring(0, 40)}...`);
                // optional add small badge in preview container
                const existingPreview = previewContainer.querySelector('img');
                if(existingPreview) {
                    // add little checkmark
                    let badgeSpan = document.createElement('div');
                    badgeSpan.style.fontSize = "0.7rem";
                    badgeSpan.style.marginTop = "0.5rem";
                    badgeSpan.style.color = "#aaa";
                    badgeSpan.innerHTML = '<i class="fas fa-link"></i> hosted ✓';
                    if(!previewContainer.querySelector('.hosted-badge')) {
                        badgeSpan.className = "hosted-badge";
                        previewContainer.appendChild(badgeSpan);
                    }
                }
            } catch(err) {
                setStatus(`upload error: ${err.message}`, true);
                currentUploadedImageUrl = null;
                previewContainer.innerHTML = `<div class="img-placeholder"><i class="fas fa-exclamation-triangle"></i> upload failed, try another image</div>`;
            }
        }

        // on file input change
        fileInput.addEventListener('change', (e) => {
            if(e.target.files && e.target.files.length) {
                handleFileSelection(e.target.files[0]);
            }
        });

        uploadTrigger.addEventListener('click', () => {
            fileInput.click();
        });

        // drag & drop support
        const dropZone = uploadTrigger;
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#ffffff";
            dropZone.style.backgroundColor = "#181818";
        });
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#3a3a3a";
            dropZone.style.backgroundColor = "#0c0c0c";
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#3a3a3a";
            dropZone.style.backgroundColor = "#0c0c0c";
            const files = e.dataTransfer.files;
            if(files.length) {
                const file = files[0];
                if(file.type.startsWith('image/')) {
                    handleFileSelection(file);
                } else {
                    setStatus("please drop an image file", true);
                }
            }
        });

        generateBtn.addEventListener('click', onGenerate);
        previewModalBtn.addEventListener('click', () => {
            if(currentGeneratedResultUrl) {
                openModalWithImage(currentGeneratedResultUrl);
            } else {
                setStatus("no generated image to preview", true);
            }
        });
        downloadBtn.addEventListener('click', downloadCurrentImage);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // set default prompt example: 
        promptTextarea.value = "make it black and white, deep shadows, artistic monochrome";
        setStatus("ready · upload image then generate");
    })();
</script>
</body>
</html>
