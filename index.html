<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID//RENDER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Inter,system-ui;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:1rem}
.app{max-width:1200px;width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2rem;padding:1.5rem;box-shadow:0 25px 60px rgba(0,0,0,.9);animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:1.5rem;border-bottom:1px solid #2c2c2c;padding-bottom:.8rem}
.brand h1{font-size:1.8rem;display:flex;justify-content:center;gap:.5rem}
.brand p{font-size:.8rem;color:#888}
.flex{display:flex;flex-wrap:wrap;gap:1.5rem}
.left{flex:1.2;min-width:250px}
.right{flex:1;min-width:260px}
.card{background:#111;border:1px solid #2b2b2b;border-radius:1.3rem;padding:1.2rem;transition:.2s}
.card:hover{transform:translateY(-2px)}
.title{font-size:1rem;margin-bottom:.8rem;border-left:3px solid #fff;padding-left:.5rem}
.upload{border:2px dashed #333;padding:1.5rem;text-align:center;border-radius:1rem;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.upload i{font-size:1.8rem;opacity:.7}
.upload:hover{border-color:#fff;background:#151515}
.preview img{max-width:100%;border-radius:.6rem;margin-top:.8rem}
textarea{width:100%;background:#050505;border:1px solid #2e2e2e;border-radius:1rem;padding:.7rem;color:#fff;margin-top:.7rem}
button{width:100%;margin-top:.8rem;background:#fff;color:#000;border:none;padding:.7rem;border-radius:2rem;font-weight:600;cursor:pointer;transition:.2s}
button:hover{transform:scale(.96)}
.status{margin-top:.8rem;font-size:.75rem;color:#aaa;text-align:center}
.result img{width:100%;border-radius:1rem;margin-top:.6rem}
.actions{display:none;margin-top:.8rem;gap:.5rem;justify-content:center}
.actions button{width:auto;padding:.5rem 1rem;font-size:.8rem;background:transparent;border:1px solid #444;color:#fff}
.actions button:hover{background:#222}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;justify-content:center;align-items:center}
.modal img{max-width:90%;max-height:90%}
.footer{text-align:center;margin-top:1rem;font-size:.7rem;color:#666}
@media(max-width:600px){
.brand h1{font-size:1.4rem}
.upload{padding:1.2rem}
}
</style>
</head>
<body>

<div class="app">
<div class="brand">
<h1><i class="fas fa-skull"></i> VOID//RENDER</h1>
<p>upload • suffer • regenerate</p>
</div>

<div class="flex">

<div class="left">
<div class="card">
<div class="title">image</div>
<div class="upload" id="up">
<i class="fas fa-cloud-upload-alt"></i>
<span>drop it here or click... try not to mess it up</span>
</div>
<input type="file" id="file" hidden>
<div class="preview" id="preview"></div>
<textarea id="prompt" placeholder="type something... or don’t, and fail"></textarea>
<button id="go">generate</button>
<div class="status" id="status">waiting... don’t disappoint immediately</div>
</div>
</div>

<div class="right">
<div class="card result">
<div class="title">result</div>
<div id="result">still empty. just like your effort</div>
<div class="actions" id="tools">
<button id="view">preview</button>
<button id="copy">copy</button>
</div>
</div>
</div>

</div>

<div class="footer">Made with 🖕by NZ R</div>
</div>

<div class="modal" id="modal">
<img id="modalImg">
</div>

<script>
const up=document.getElementById("up")
const file=document.getElementById("file")
const preview=document.getElementById("preview")
const go=document.getElementById("go")
const status=document.getElementById("status")
const result=document.getElementById("result")
const tools=document.getElementById("tools")
const modal=document.getElementById("modal")
const modalImg=document.getElementById("modalImg")

let uploaded=null
let output=null

const key="0be58d103f6f628f39a5ecda27e0f440"

up.onclick=()=>file.click()

up.ondragover=e=>{
e.preventDefault()
up.style.borderColor="#fff"
}

up.ondragleave=()=>{
up.style.borderColor="#333"
}

up.ondrop=e=>{
e.preventDefault()
up.style.borderColor="#333"
handleFile(e.dataTransfer.files[0])
}

file.onchange=e=>{
handleFile(e.target.files[0])
}

function handleFile(f){
if(!f)return
if(f.size>5*1024*1024){
status.innerText="too big. are you trying to break it?"
return
}
const r=new FileReader()
r.onload=x=>{
preview.innerHTML=`<img src="${x.target.result}">`
}
r.readAsDataURL(f)
upload(f)
}

async function upload(f){
status.innerText="uploading... don’t ruin this too"
let fd=new FormData()
fd.append("key",key)
fd.append("image",f)
try{
let res=await fetch("https://api.imgbb.com/1/upload",{method:"POST",body:fd})
let data=await res.json()
if(data.success){
uploaded=data.data.url
status.innerText="uploaded. now try not to ruin it"
}else{
status.innerText="upload failed. impressive failure"
}
}catch{
status.innerText="network died. not shocking"
}
}

go.onclick=async()=>{
if(!uploaded){
status.innerText="no image. genius move"
return
}

let p=document.getElementById("prompt").value
if(!p){
status.innerText="no prompt. what did you expect?"
return
}

status.innerText="processing... don’t cry yet"
result.innerHTML="thinking..."
tools.style.display="none"

try{
let url=`https://rifatapiv3.vercel.app/api/ai/nanopro?p=${encodeURIComponent(p)}&url=${encodeURIComponent(uploaded)}`
let res=await fetch(url)
let data=await res.json()

if(data.status){
output=data.result
result.innerHTML=`<img src="${output}">`
tools.style.display="flex"
status.innerText="done. somehow not terrible"
}else{
status.innerText="AI failed. like expected"
}
}catch{
status.innerText="request crashed. great job"
}
}

document.getElementById("view").onclick=()=>{
modal.style.display="flex"
modalImg.src=output
}

modal.onclick=()=>modal.style.display="none"

document.getElementById("copy").onclick=async()=>{
try{
const res=await fetch(output)
const blob=await res.blob()
await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})])
status.innerText="copied. now disappear"
}catch{
status.innerText="copy failed. obviously"
}
}
</script>

</body>
</html>
