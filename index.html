<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>VOID//RENDER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:1rem;line-height:1.4}
.app{max-width:1200px;width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2rem;padding:1.5rem;box-shadow:0 25px 60px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,0.02);animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:1.5rem;border-bottom:1px solid #2c2c2c;padding-bottom:.8rem}
.brand h1{font-size:1.8rem;display:flex;justify-content:center;gap:.5rem;letter-spacing:-0.3px;font-weight:500}
.brand p{font-size:.8rem;color:#888;margin-top:4px}
.flex{display:flex;flex-wrap:wrap;gap:1.5rem}
.left{flex:1.2;min-width:250px}
.right{flex:1;min-width:260px}
.card{background:#111;border:1px solid #2b2b2b;border-radius:1.3rem;padding:1.2rem;transition:all .2s ease;backdrop-filter:blur(0px)}
.card:hover{transform:translateY(-2px);border-color:#3a3a3a}
.title{font-size:1rem;margin-bottom:.8rem;border-left:3px solid #fff;padding-left:.5rem;font-weight:500;letter-spacing:-0.2px}
.upload{border:2px dashed #333;padding:1.5rem;text-align:center;border-radius:1rem;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:.5rem;background:#090909}
.upload i{font-size:1.8rem;opacity:.7}
.upload:hover{border-color:#fff;background:#151515}
.preview img{max-width:100%;border-radius:.6rem;margin-top:.8rem;border:1px solid #2a2a2a;background:#0a0a0a;display:block}
textarea{width:100%;background:#050505;border:1px solid #2e2e2e;border-radius:1rem;padding:.8rem;color:#fff;margin-top:.7rem;font-family:inherit;resize:vertical;font-size:0.85rem}
textarea:focus{outline:none;border-color:#555}
button{width:100%;margin-top:.8rem;background:#fff;color:#000;border:none;padding:.7rem;border-radius:2rem;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
button:hover{transform:scale(.96);background:#e0e0e0}
.status{margin-top:.8rem;font-size:.75rem;color:#aaa;text-align:center;word-break:break-word}
.result img{width:100%;border-radius:1rem;margin-top:.6rem;border:1px solid #333;background:#000;cursor:pointer}
.actions{display:none;margin-top:.8rem;gap:.5rem;justify-content:center}
.actions button{width:auto;padding:.5rem 1rem;font-size:.8rem;background:transparent;border:1px solid #444;color:#fff;margin-top:0}
.actions button:hover{background:#222;transform:scale(.98)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);display:none;justify-content:center;align-items:center;z-index:1000;backdrop-filter:blur(8px)}
.modal img{max-width:90%;max-height:90%;object-fit:contain;border-radius:1rem;box-shadow:0 0 0 1px #333}
.modal span{position:absolute;top:20px;right:30px;font-size:28px;color:#fff;cursor:pointer;font-weight:bold}
.footer{text-align:center;margin-top:1rem;font-size:.7rem;color:#666}
@media(max-width:600px){
.brand h1{font-size:1.4rem}
.upload{padding:1.2rem}
.card{padding:1rem}
}
</style>
</head>
<body>

<div class="app">
<div class="brand">
<h1><i class="fas fa-skull"></i> VOID//RENDER</h1>
<p>upload • suffer • regenerate</p>
</div>

<div class="flex">

<div class="left">
<div class="card">
<div class="title">image</div>
<div class="upload" id="up">
<i class="fas fa-cloud-upload-alt"></i>
<span>drop it here or click... try not to mess it up</span>
</div>
<input type="file" id="file" hidden accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/tiff,image/svg+xml,image/avif,image/heic,image/heif,image/jpg">
<div class="preview" id="preview"></div>
<textarea id="prompt" placeholder="type something... or don’t, and fail"></textarea>
<button id="go">generate</button>
<div class="status" id="status">waiting... don’t disappoint immediately</div>
</div>
</div>

<div class="right">
<div class="card result">
<div class="title">result</div>
<div id="result">still empty. just like your effort</div>
<div class="actions" id="tools">
<button id="view">preview</button>
<button id="copy">copy</button>
<button id="download">download</button>
</div>
</div>
</div>

</div>

<div class="footer">Made with 🖕by NZ R</div>
</div>

<div class="modal" id="modal">
<span id="closeModal">&times;</span>
<img id="modalImg">
</div>

<script>
const up = document.getElementById("up");
const fileInput = document.getElementById("file");
const previewDiv = document.getElementById("preview");
const goBtn = document.getElementById("go");
const statusDiv = document.getElementById("status");
const resultDiv = document.getElementById("result");
const toolsPanel = document.getElementById("tools");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const closeModalSpan = document.getElementById("closeModal");

let uploadedImageUrl = null;
let generatedImageUrl = null;
let currentRawImageBlob = null;

const IMGBB_API_KEY = "0be58d103f6f628f39a5ecda27e0f440";
const MAX_SIZE_MB = 12;

function showStatus(msg, isError = false) {
    statusDiv.innerHTML = msg;
    if(isError) {
        statusDiv.style.color = "#ff7777";
        setTimeout(() => { if(statusDiv.innerHTML === msg) statusDiv.style.color = "#aaa"; }, 2500);
    } else {
        statusDiv.style.color = "#aaa";
    }
}

function validateImageType(file) {
    const allowedTypes = [
        'image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif', 
        'image/bmp', 'image/tiff', 'image/svg+xml', 'image/avif', 
        'image/heic', 'image/heif', 'image/x-icon'
    ];
    if(allowedTypes.includes(file.type)) return true;
    const ext = file.name.split('.').pop().toLowerCase();
    const imageExts = ['jpg','jpeg','png','webp','gif','bmp','tiff','svg','avif','heic','heif','ico'];
    if(imageExts.includes(ext)) return true;
    return false;
}

function handleFile(fileObj) {
    if(!fileObj) {
        showStatus("no file selected. disappointing", true);
        return false;
    }
    
    if(fileObj.size > MAX_SIZE_MB * 1024 * 1024) {
        showStatus(`file exceeds ${MAX_SIZE_MB}MB. too heavy, genius`, true);
        return false;
    }
    
    if(!validateImageType(fileObj)) {
        showStatus("unsupported image format. use jpg, png, webp, gif, bmp, tiff, avif, heic, svg etc", true);
        return false;
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
        previewDiv.innerHTML = `<img src="${e.target.result}" alt="preview" style="max-width:100%; border-radius:0.6rem;">`;
    };
    reader.readAsDataURL(fileObj);
    uploadToImgBB(fileObj);
    return true;
}

up.onclick = () => fileInput.click();

up.ondragover = (e) => {
    e.preventDefault();
    up.style.borderColor = "#fff";
    up.style.background = "#151515";
};

up.ondragleave = () => {
    up.style.borderColor = "#333";
    up.style.background = "#090909";
};

up.ondrop = (e) => {
    e.preventDefault();
    up.style.borderColor = "#333";
    up.style.background = "#090909";
    const droppedFile = e.dataTransfer.files[0];
    if(droppedFile) handleFile(droppedFile);
    else showStatus("drop something valid, maybe an image?", true);
};

fileInput.onchange = (e) => {
    if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
};

async function uploadToImgBB(imageFile) {
    showStatus("uploading to void... please wait");
    uploadedImageUrl = null;
    const formData = new FormData();
    formData.append("key", IMGBB_API_KEY);
    formData.append("image", imageFile);
    
    try {
        const response = await fetch("https://api.imgbb.com/1/upload", {
            method: "POST",
            body: formData
        });
        const json = await response.json();
        if(json.success && json.data && json.data.url) {
            uploadedImageUrl = json.data.url;
            showStatus(`image uploaded. ready to suffer.`);
        } else {
            let errorMsg = json.error?.message || "unknown imgbb error";
            showStatus(`upload failed: ${errorMsg}`, true);
            uploadedImageUrl = null;
        }
    } catch(err) {
        console.error(err);
        showStatus("network failure during upload. check connection", true);
        uploadedImageUrl = null;
    }
}

goBtn.onclick = async () => {
    if(!uploadedImageUrl) {
        showStatus("no uploaded image. give me an image first", true);
        return;
    }
    
    const promptText = document.getElementById("prompt").value.trim();
    if(!promptText) {
        showStatus("empty prompt. write something, anything", true);
        return;
    }
    
    showStatus("summoning AI demons...");
    resultDiv.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fas fa-spinner fa-pulse" style="font-size:2rem; opacity:0.6;"></i><p style="margin-top:12px; font-size:0.8rem;">rendering void...</p></div>`;
    toolsPanel.style.display = "none";
    generatedImageUrl = null;
    currentRawImageBlob = null;
    
    try {
        const apiEndpoint = `https://rifatapiv3.vercel.app/api/ai/nanopro?p=${encodeURIComponent(promptText)}&url=${encodeURIComponent(uploadedImageUrl)}`;
        const response = await fetch(apiEndpoint, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });
        
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if(data && data.status === true && data.result) {
            let imageResultUrl = data.result;
            if(typeof imageResultUrl === "string" && (imageResultUrl.startsWith("http") || imageResultUrl.startsWith("//"))) {
                if(imageResultUrl.startsWith("//")) imageResultUrl = "https:" + imageResultUrl;
                generatedImageUrl = imageResultUrl;
                resultDiv.innerHTML = `<img src="${generatedImageUrl}" alt="generated result" id="resultImg" style="cursor:pointer;" crossorigin="anonymous">`;
                toolsPanel.style.display = "flex";
                showStatus("done. somehow not terrible");
                
                try {
                    const imgFetch = await fetch(generatedImageUrl);
                    if(imgFetch.ok) {
                        const blob = await imgFetch.blob();
                        currentRawImageBlob = blob;
                    } else {
                        currentRawImageBlob = null;
                    }
                } catch(blobErr) {
                    currentRawImageBlob = null;
                }
                
                const resultImgElement = document.getElementById("resultImg");
                if(resultImgElement) {
                    resultImgElement.onclick = () => {
                        modal.style.display = "flex";
                        modalImg.src = generatedImageUrl;
                    };
                }
            } else {
                throw new Error("invalid image url from api");
            }
        } else {
            let errMsg = data?.message || data?.error || "ai returned failure state";
            throw new Error(errMsg);
        }
    } catch(error) {
        console.error(error);
        showStatus(`AI crashed: ${error.message.substring(0, 80)}`, true);
        resultDiv.innerHTML = `<div style="padding:1rem; text-align:center; color:#ff8080;"><i class="fas fa-exclamation-triangle"></i> generation failed. try again later</div>`;
        toolsPanel.style.display = "none";
        generatedImageUrl = null;
    }
};

document.getElementById("view").onclick = () => {
    if(generatedImageUrl) {
        modal.style.display = "flex";
        modalImg.src = generatedImageUrl;
    } else {
        showStatus("nothing to preview. generate an image first", true);
    }
};

document.getElementById("copy").onclick = async () => {
    if(!generatedImageUrl) {
        showStatus("no image to copy. generate something", true);
        return;
    }
    
    try {
        let blobToCopy = currentRawImageBlob;
        if(!blobToCopy) {
            const response = await fetch(generatedImageUrl);
            if(!response.ok) throw new Error("failed to fetch image");
            blobToCopy = await response.blob();
            currentRawImageBlob = blobToCopy;
        }
        
        const allowedTypesForClip = ["image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp"];
        if(!allowedTypesForClip.includes(blobToCopy.type) && !blobToCopy.type.startsWith("image/")) {
            throw new Error("clipboard only supports common image types, try download");
        }
        
        await navigator.clipboard.write([
            new ClipboardItem({
                [blobToCopy.type]: blobToCopy
            })
        ]);
        showStatus("image copied to clipboard. now disappear");
    } catch(err) {
        console.warn(err);
        showStatus("copy failed. try downloading instead", true);
    }
};

document.getElementById("download").onclick = () => {
    if(!generatedImageUrl) {
        showStatus("no image available for download", true);
        return;
    }
    
    const link = document.createElement("a");
    link.href = generatedImageUrl;
    const extension = generatedImageUrl.split('.').pop().split('?')[0];
    let filename = `void_render_${Date.now()}.${extension === 'jpg' || extension === 'png' || extension === 'webp' || extension === 'gif' ? extension : 'png'}`;
    if(!['jpg','jpeg','png','webp','gif','bmp'].includes(extension.toLowerCase())) filename = `void_render_${Date.now()}.png`;
    link.download = filename;
    link.target = "_blank";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showStatus("download started. enjoy your cursed creation");
};

modal.onclick = (e) => {
    if(e.target === modal) modal.style.display = "none";
};
closeModalSpan.onclick = () => {
    modal.style.display = "none";
};

window.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && modal.style.display === "flex") {
        modal.style.display = "none";
    }
});

function forceImageSupportPreview() {
    const previewObserver = new MutationObserver(() => {
        const img = previewDiv.querySelector('img');
        if(img && img.complete && img.naturalWidth === 0) {
            img.style.opacity = '0.5';
            img.alt = "corrupted preview?";
        }
    });
    previewObserver.observe(previewDiv, { childList: true, subtree: true });
}
forceImageSupportPreview();

const originalUploadHandler = handleFile;
window.handleFileFallback = (file) => {
    if(file && file.type === 'image/heic') {
        showStatus("HEIC support limited, try converting to JPG/PNG for best results", false);
    }
    return originalUploadHandler(file);
};

const fileAcceptAttr = fileInput.getAttribute('accept');
if(fileAcceptAttr && fileAcceptAttr.includes(',')) {
}
fileInput.accept = "image/jpeg,image/jpg,image/png,image/webp,image/gif,image/bmp,image/tiff,image/svg+xml,image/avif,image/heic,image/heif,.heic,.heif,.avif,.bmp,.tiff,.webp";

const uploadDiv = document.getElementById("up");
if(uploadDiv) {
    uploadDiv.addEventListener("dragenter", (e) => {
        e.preventDefault();
        uploadDiv.style.borderColor = "#fff";
        uploadDiv.style.backgroundColor = "#151515";
    });
}
</script>

</body>
</html>
